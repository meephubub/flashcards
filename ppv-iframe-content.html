    <script>
        player = jwplayer("v").setup({

            console.log("auto rec");
            setTimeout(function(){
                try {
                    player.stop();
                } catch(err) {
                    console.log("stop fail");
                }
            }, 500);

            setTimeout(function(){ 
                try {
                    player.load({file: 'https://gg.poocloud.in/epl_newcastle/index.m3u8'});

<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="robots" content="noindex,nofollow,noarchive,notranslate,noimageindex,nosnippet">
    <meta name="viewport" content="width=device-width,initial-scale=1,shrink-to-fit=no">
    <script defer event-ppvinternal="PPV-INTERNAL-11136" data-domain="ppvs.su" src="https://p.vidembed.re/js/script.pageview-props.tagged-events.js"></script>
    <link href="https://fonts.bunny.net/css?family=lexend-deca:400" rel="stylesheet">
    <title>PPV Player</title>
    <meta name="description" content="Generic PPV HLS Player">
    <style>
html{height:100%;}body{font-family:"Lexend deca",sans-serif;height:100%;width:100%;margin:0;overflow:hidden;background-color:black;}*{font-family:"Lexend deca",sans-serif!important;}
#loading, #resume { top: 0; width: 100%; height: 100%; position: absolute; }
#loading { display: flex; z-index: 11; }
#resume { left: 0; z-index: 12; }
.pop-wrap { display: table; position: absolute; height: 100%; width: 100%; }
.pop-main { display: table-cell; vertical-align: middle; }
.pop-html { margin-left: auto; margin-right: auto; text-align: center; }
.pop-block { display: inline-block; position: relative; }
.myConfirm { max-width: 260px; max-height: 160px; padding: 10px; border-radius: 15px; font-size: 14px; line-height: 1.3em; background-color: #0a0a0a; color: #f2f2f2; }
.button { border-width: 0; padding: 5px 15px; line-height: 1.5; border-radius: 20px; text-transform: uppercase; font-size: 80%; font-weight: 700; margin: 5px 5px 5px 0; cursor: pointer; outline: none; background-color: #1a1a1a; color: #ffffff; }
@keyframes rotate-loading { 0% { transform: rotate(0);} 100% { transform: rotate(360deg);} }
@keyframes loading-text-opacity { 0%, 100%, 20% { opacity: 0; } 50% { opacity: 1; } }
.loading-ani, .loading-container { position: relative; margin: auto; width: 100px; height: 100px; border-radius: 100%; }
.loading-ani { border: 2px solid transparent; border-color: transparent #fff transparent #FFF; animation: rotate-loading 1.5s linear 0s infinite normal; transform-origin: 50% 50%; }
.loading-container .loading-text { animation: loading-text-opacity 2s linear 0s infinite normal; color: #fff; font-size: 10px; font-weight: 700; margin-top: 45px; opacity: 0; position: absolute; text-align: center; text-transform: uppercase; top: 0; width: 100px; }
#v { height: 100vh !important; }
#notif { display: none; position: fixed; top: 40%; width: 80%; left: 50%; padding: 5px; text-align: center; font-size: large; z-index: 11; color: white; background-color: rgba(0, 0, 0, 0.57); transform: translate(-50%, -50%); }
.jw-rightclick-link.jw-info-overlay-item, .jw-rightclick-item.jw-featured { display: none !important; }
.jw-button-container .jw-settings-sharing, .jw-button-container .jw-icon-cc { display: none !important; }
.jw-rightclick-link { color: #d2d2d2 !important; }
.jw-rightclick-link span { color: #fff !important; }
.jw-svg-icon-download { height: 24px !important; width: 24px !important; }
.jw-svg-icon-qswitch { width: auto !important; }
.jw-controlbar .jw-button-image { max-height: 30px !important; }
.jw-text-live { color: #ff0000c7 !important; }
.jwplayer, .jw-reset, .jw-reset-text, .jw-float-bar-title { font-family: "Lexend deca", sans-serif; }
    </style>
  </head>
  <body class="container">
    <div id="notif"></div>
    <div id="v"></div>
    <div id="loading">
      <div class="loading-container">
        <div class="loading-ani"></div>
        <div class="loading-text">loading</div>
      </div>
    </div>

    <!-- Load JW Player from CDN -->
    <script sync src="https://ssl.p.jwpcdn.com/player/v/8.36.4/jwplayer.js"></script>
    <script>
      (function() {
        // Read query params
        const params = new URLSearchParams(window.location.search);
        const srcParam = params.get('src');
        const titleParam = params.get('title');

        // Fallback to the existing HLS from ppv-iframe-content.html if not provided
        const defaultSrc = 'https://gg.poocloud.in/epl_newcastle/index.m3u8';

        // Basic sanity check: only allow http(s) sources
        const isValidHttp = (url) => /^https?:\/\//i.test(url || '');
        const streamSrc = isValidHttp(srcParam) ? srcParam : defaultSrc;

        // Title fallback
        const playerTitle = titleParam || 'PPV Stream';

        // Setup JW Player
        const player = jwplayer('v').setup({
          width: '100%',
          height: '720',
          title: playerTitle,
          aspectratio: '16:9',
          responsive: true,
          repeat: true,
          displayTitle: true,
          playlist: [{ file: streamSrc }],
          hlsjsConfig: { abrEnabled: false },
          cast: {}
        });

        player.on('ready', function() {
          const spinner = document.querySelector('#loading');
          if (spinner) spinner.remove();
        });

        player.on('error', function() {
          // retry after a short delay using the same stream source
          setTimeout(function(){
            try { player.stop(); } catch(_) {}
          }, 500);
          setTimeout(function(){
            try {
              player.load({ file: streamSrc });
              player.play();
            } catch(_) {}
          }, 700);
        });
      })();
    </script>
  </body>
</html>

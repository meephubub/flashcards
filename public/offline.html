<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Offline – Flashcard App</title>
    <meta name="theme-color" content="#ffffff" />
    <style>
      html,body { height:100%; margin:0; font-family: system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif; }
      body { display:flex; align-items:center; justify-content:center; background:#f7f7f7; color:#111; }
      .card { background:#fff; border:1px solid rgba(0,0,0,.08); border-radius:16px; padding:24px; box-shadow:0 2px 10px rgba(0,0,0,.04); max-width:520px; text-align:center; }
      h1 { font-size:20px; margin:0 0 8px; }
      p { margin:8px 0; color:#444; }
      code { background:#f0f0f0; padding:.1rem .3rem; border-radius:6px; }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>You're offline</h1>
      <p>The Flashcard App can't reach the internet right now.</p>
      <p>Try reconnecting, then refresh this page.</p>
      <p style="margin-top:12px; font-size:12px; color:#666">Tip: Add the app to your home screen for a better offline experience.</p>
    </div>
  </body>
</html>
